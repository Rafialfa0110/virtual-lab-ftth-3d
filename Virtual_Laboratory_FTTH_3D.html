<style>
:root{--bg:#060d17;--panel:rgba(10,22,40,.82);--cyan:#22d3ee;--blue:#0ea5e9;--line:rgba(34,211,238,.25)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#e2e8f0;font-family:Inter,system-ui,Arial,sans-serif}
body{background-image:radial-gradient(circle at 50% 48%,rgba(14,165,233,.13),transparent 42%),linear-gradient(rgba(34,211,238,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.035) 1px,transparent 1px);background-size:auto,34px 34px,34px 34px}
.glass{background:var(--panel);backdrop-filter:blur(15px);border:1px solid var(--line);box-shadow:0 10px 35px #0008,inset 0 0 22px #0ea5e90a}
.card{background:rgba(15,31,56,.7);border:1px solid rgba(34,211,238,.16);transition:.2s}
.card:hover,.card.active{border-color:var(--cyan);background:rgba(14,165,233,.17);box-shadow:0 0 18px #22d3ee22}
button,input,select{font:inherit}button{cursor:pointer}

.pin.selected{background:var(--cyan);color:#061321}
header{position:absolute;z-index:20;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
header>*{pointer-events:auto}
#left,#right{position:absolute;z-index:15;top:88px;bottom:94px;width:300px;display:flex;flex-direction:column;overflow:hidden}
#left{left:12px}#right{right:12px;width:340px}
#dock{position:absolute;z-index:20;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;max-width:calc(100vw - 24px);overflow-x:auto;white-space:nowrap}
.btn{border:1px solid #22d3ee44;background:#0b1c30;color:#b9f5ff;padding:9px 11px;border-radius:10px;font-size:12px}
.btn.active{background:#0e7490;color:white;border-color:#67e8f9}
.small{font-size:11px;color:#94a3b8}.tag{font:10px ui-monospace,monospace;letter-spacing:.12em;color:#67e8f9}
#rightContent{overflow:auto;min-height:0}
input[type=range]{accent-color:#22d3ee;width:110px}
#toast{position:absolute;z-index:50;bottom:85px;left:50%;transform:translateX(-50%);display:none}

@media(max-width:760px){header{top:7px;left:7px;right:7px}header .status{display:none}#left,#right{top:75px;bottom:82px;width:min(86vw,330px);transition:transform .25s}#left{transform:translateX(-115%)}#right{transform:translateX(115%)}#left.open,#right.open{transform:translateX(0)}#dock{bottom:7px}.brand h1{font-size:11px}.brand{padding:8px!important}}
</style>

 olt:[[0,.45,.55],[-.95,-.03,.56],[.65,-.1,-.56],[0,.48,0],[0,-.35,-.57]],
 odf:[[0,1.1,.35],[-.8,.48,.35],[.8,-.48,.35],[0,-1.35,.28],[0,.2,-.45]],
 odc:[[0,1.4,.58],[-.42,.2,.7],[.48,.2,.7],[0,-1.2,.58],[-.42,-.78,.7]],
 splitter:[[-.82,-.02,.42],[-.25,0,.42],[.45,-.05,.42],[0,.36,.36],[.7,-.25,.7]],
 odp:[[0,.75,.35],[-.55,.35,.44],[.55,-.35,.44],[0,-.75,.35],[0,-.4,-.35]],
 cable:[[-1.2,0,.55],[-.4,0,.5],[.4,0,.5],[1.2,0,.55],[0,.42,.25]],
 ont:[[0,.59,.28],[-.52,-.2,.32],[.48,.12,.33],[-.2,-.8,.55],[0,1.0,-.12]]
};

let current='olt',activePin=0,activeTab='struktur',quizQuestion=0,quizScore=0,showPins=true,autoRotate=true,xray=false,wire=false,clipPlane=null,signal=null;
const $=id=>document.getElementById(id);
let scene,camera,renderer,controls,model,pinEls=[],clock=new THREE.Clock();

function mat(color,metal=0,rough=.45){
 return new THREE.MeshStandardMaterial({color,metalness:metal,roughness:rough});
}
const steel=mat(0x64748b,.75,.3),dark=mat(0x172b42,.55,.38),blue=mat(0x0e7490,.45,.3),cyan=mat(0x22d3ee,.4,.25),black=mat(0x07111e,.2,.55),white=mat(0xcbd5e1,.25,.4),yellow=mat(0xfbbf24,.25,.35),fiber=mat(0x38bdf8,.2,.3),green=mat(0x22c55e,.2,.35);

function box(g,x,y,z,sx,sy,sz,m){let mesh=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);mesh.position.set(x,y,z);g.add(mesh);return mesh}
function cyl(g,x,y,z,r1,r2,h,m,seg=24){let o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg),m);o.position.set(x,y,z);g.add(o);return o}
function tube(g,pts,r,m){let curve=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)));let o=new THREE.Mesh(new THREE.TubeGeometry(curve,Math.max(24,pts.length*10),r,8,false),m);g.add(o);return o}
function sphere(g,x,y,z,sx,sy,sz,m){let o=new THREE.Mesh(new THREE.SphereGeometry(1,24,18),m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);g.add(o);return o}

function makeModel(id){
 const g=new THREE.Group();
 if(id==='olt'){
  box(g,0,0,0,2.5,.85,1.05,dark);box(g,0,.46,0,2.48,.08,1.03,steel);
  for(let i=0;i<12;i++){box(g,-1.05+i*.19,-.03,.54,.12,.24,.025,black);sphere(g,-1.05+i*.19,-.03,.58,.025,.025,.018,i%3?green:yellow)}
  for(let i=0;i<4;i++){box(g,-.8+i*.53,-.1,-.54,.42,.52,.06,blue);for(let j=0;j<4;j++)cyl(g,-.92+i*.53+j*.09,-.12,-.59,.035,.035,.04,cyan,12)}
  for(let i=0;i<5;i++)box(g,-1+i*.5,-.35,-.57,.25,.025,.02,white);
 }else if(id==='odf'){
  box(g,0,0,0,2.25,2.65,.5,dark);box(g,0,1.35,0,2.3,.12,.56,steel);box(g,0,-1.35,0,2.3,.12,.56,steel);
  for(let row=0;row<5;row++){box(g,0,.95-row*.48,.28,2.05,.36,.07,black);for(let i=0;i<12;i++){let x=-.9+i*.164;cyl(g,x,.95-row*.48,.34,.045,.045,.07,i%3===0?yellow:cyan,12)}}
  for(let i=0;i<8;i++)tube(g,[[-.95+i*.27,-1.25,-.28],[-.95+i*.27,-.8,-.48],[-.8+i*.22,.8,-.45]],.018,i%2?fiber:yellow);
 }else if(id==='odc'){
  box(g,0,0,0,1.8,2.7,1.1,blue);box(g,0,0,.57,1.72,2.55,.08,steel);
  box(g,-.42,0,.63,.78,2.3,.04,dark);box(g,.48,0,.63,.78,2.3,.04,dark);
  for(let i=0;i<4;i++){box(g,-.42,-.78+i*.5,.68,.65,.34,.035,steel);for(let j=0;j<6;j++)cyl(g,-.68+j*.1,-.78+i*.5,.72,.025,.025,.035,cyan,10)}
  for(let i=0;i<3;i++)box(g,.48,-.65+i*.62,.68,.65,.48,.04,black);
  box(g,0,1.42,.58,1.8,.12,.1,yellow);
 }else if(id==='splitter'){
  box(g,0,0,0,1.8,.65,.72,white);box(g,0,.34,0,1.8,.08,.72,steel);
  box(g,-.25,0,.39,.65,.22,.04,blue);for(let i=0;i<8;i++){cyl(g,.32+(i%4)*.32,-.05,.4,.055,.055,.07,cyan,12);tube(g,[[.32+(i%4)*.32,-.05,.42],[.4+(i%4)*.32,-.25,.7]],.012,fiber)}
  cyl(g,-.82,-.02,.4,.07,.07,.08,yellow,12);
 }else if(id==='odp'){
  box(g,0,0,0,1.55,1.45,.65,white);box(g,0,.73,0,1.62,.12,.7,steel);box(g,0,-.73,0,1.62,.12,.7,steel);
  box(g,0,0,.35,1.35,1.2,.05,dark);
  for(let i=0;i<8;i++){cyl(g,-.55+(i%4)*.36,.35-Math.floor(i/4)*.7,.42,.075,.075,.08,cyan,16);sphere(g,-.55+(i%4)*.36,.35-Math.floor(i/4)*.7,.48,.025,.025,.02,yellow)}
  tube(g,[[-.7,-.55,-.2],[0,-.35,-.35],[.65,-.55,-.2]],.035,fiber);
 }else if(id==='cable'){
  cyl(g,0,0,0,.63,.63,2.7,dark,48).rotation.z=Math.PI/2;
  cyl(g,0,0,0,.46,.46,2.72,steel,48).rotation.z=Math.PI/2;
  cyl(g,0,0,0,.31,.31,2.74,white,48).rotation.z=Math.PI/2;
  cyl(g,0,0,0,.15,.15,2.78,cyan,48).rotation.z=Math.PI/2;
  for(let i=0;i<6;i++){let a=i*Math.PI/3;sphere(g,0,Math.cos(a)*.35,Math.sin(a)*.35,.12,.12,.12,i%2?yellow:green)}
  tube(g,[[-1.6,0,0],[1.6,0,0]],.07,fiber);
 }else if(id==='ont'){
  box(g,0,0,0,1.65,1.15,.55,white);box(g,0,.57,0,1.65,.08,.55,steel);
  for(let i=0;i<4;i++)box(g,-.52+i*.35,-.2,.3,.2,.06,.035,black);
  for(let i=0;i<4;i++)sphere(g,-.48+i*.3,.12,.31,.035,.035,.025,i===0?green:cyan);
  for(let i=0;i<2;i++)cyl(g,-.5+i,.65,-.12,.035,.035,.7,black,12);
  tube(g,[[-.2,-.45,.2],[-.2,-.8,.55],[.4,-.8,.55]],.045,fiber);
 }
 g.traverse(o=>{
  if(o.isMesh){
   o.material=o.material.clone();
   o.userData.clonedMat=true;
  }
 });
 return g;
}

function applyVisualModes(targetModel){
 if(!targetModel)return;
 const v=$('axis').value;
 const normal=v==='x'?new THREE.Vector3(1,0,0):v==='y'?new THREE.Vector3(0,1,0):v==='z'?new THREE.Vector3(0,0,1):null;
 clipPlane=normal?new THREE.Plane(normal,parseFloat($('slice').value)):null;
 targetModel.traverse(o=>{
  if(o.isMesh){
   if(!o.userData.clonedMat){
    o.material=o.material.clone();
    o.userData.clonedMat=true;
   }
   o.material.transparent=xray;
   o.material.opacity=xray?.35:1;
   o.material.depthWrite=!xray;
   o.material.wireframe=wire;
   o.material.clippingPlanes=clipPlane?[clipPlane]:[];
   o.material.needsUpdate=true;
  }
 });
}

function addPedestal(){
 let p=new THREE.Group();
 let base=new THREE.Mesh(new THREE.CylinderGeometry(1.65,1.8,.12,64),dark);base.position.y=-1.55;p.add(base);
 let ring=new THREE.Mesh(new THREE.TorusGeometry(1.55,.025,12,100),cyan);ring.rotation.x=Math.PI/2;ring.position.y=-1.47;p.add(ring);
 let disk=new THREE.Mesh(new THREE.CylinderGeometry(1.35,1.35,.025,64),mat(0x0b2438,.3,.6));disk.position.y=-1.47;p.add(disk);
 scene.add(p);
}

function init3D(){
 scene=new THREE.Scene();scene.fog=new THREE.Fog(0x060d17,9,22);
 camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(4,3.1,6.5);
 renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.localClippingEnabled=true;$('stage').appendChild(renderer.domElement);
 controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.autoRotate=true;controls.autoRotateSpeed=1.0;controls.target.set(0,0,0);
 scene.add(new THREE.HemisphereLight(0x9deaff,0x101827,1.5));
 let l=new THREE.DirectionalLight(0xffffff,2.1);l.position.set(4,7,5);scene.add(l);
 let c=new THREE.PointLight(0x0ea5e9,2,12);c.position.set(-3,2,2);scene.add(c);
 let grid=new THREE.GridHelper(16,32,0x155e75,0x123047);grid.position.y=-1.62;scene.add(grid);
 addPedestal();
 loadDevice(current);
 window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
 animate();
}

function loadCustomGLB(url){
 return new Promise((resolve,reject)=>{
  if(!THREE.GLTFLoader){reject(new Error('GLTFLoader belum tersedia'));return}
  new THREE.GLTFLoader().load(url,gltf=>{
   if(model)scene.remove(model);
   model=gltf.scene;scene.add(model);model.position.set(0,0,0);
   applyVisualModes(model);
   resolve(model);
  },undefined,reject);
 });
}

function loadDevice(id){
 current=id;activePin=0;quizQuestion=0;
 if(model){
  scene.remove(model);
  model.traverse(o=>{
   if(o.geometry)o.geometry.dispose();
   if(o.material&&o.userData.clonedMat)o.material.dispose();
  });
 }
 model=makeModel(id);scene.add(model);model.position.y=.05;
 applyVisualModes(model);
 const d=devices.find(x=>x.id===id);
 $('activeName').textContent=d.name;$('activeSub').textContent=d.full;$('detailName').textContent=d.name;$('detailLatin').textContent=d.full;
 renderCatalog();renderTab();renderPins();
 camera.position.set(4,3.1,6.5);controls.target.set(0,0,0);controls.update();
}

function renderCatalog(){
 const q=$('search').value.toLowerCase(),filter=document.querySelector('[data-filter].active')?.dataset.filter||'Semua';
 $('catalog').innerHTML=devices.filter(d=>(filter==='Semua'||d.cat===filter)&&(d.name+' '+d.full).toLowerCase().includes(q)).map(d=>`<button class="card ${d.id===current?'active':''} w-full text-left rounded-xl p-3" onclick="loadDevice('${d.id}')"><div class="flex justify-between"><b>${d.name}</b><span class="tag">${d.cat}</span></div><div class="small mt-1">${d.full}</div><div class="small mt-2 text-cyan-300">5 hotspot anatomi →</div></button>`).join('');
}

function renderTab(){
 const d=devices.find(x=>x.id===current),root=$('rightContent');
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));
 if(activeTab==='struktur'){
  root.innerHTML=`<div class="tag mb-2">DESKRIPSI & FUNGSI</div><p class="text-sm leading-6 text-slate-300">${d.desc}</p><div class="grid grid-cols-2 gap-2 mt-4">${d.specs.map(s=>`<div class="card rounded-xl p-3"><div class="small">${s[0]}</div><b class="text-sm text-cyan-200">${s[1]}</b></div>`).join('')}</div><div class="mt-4 card rounded-xl p-3"><div class="tag mb-2">TITIK HOTSPOT AKTIF (#${activePin+1})</div><b>${d.parts[activePin][0]}</b><p class="small mt-2 leading-5">${d.parts[activePin][1]}</p></div>`;
 }else if(activeTab==='klinis'){
  root.innerHTML=`<div class="tag mb-3">GANGGUAN & TROUBLESHOOTING UMUM</div>${d.issues.map(i=>`<div class="card rounded-xl p-3 mb-2"><b class="text-sm text-rose-300">${i[0]}</b><p class="small mt-2"><b>Penyebab:</b> ${i[1]}</p><p class="small mt-1"><b>Dampak:</b> ${i[2]}</p></div>`).join('')}`;
 }else{
  const part=d.parts[quizQuestion%5];
  root.innerHTML=`<div class="tag">KUIS IDENTIFIKASI PERANGKAT</div><div class="card rounded-xl p-4 mt-3"><p class="small">Pertanyaan ${quizQuestion%5+1} dari 5</p><h3 class="font-bold mt-2">Klik hotspot yang sesuai dengan petunjuk bagian perangkat <span class="text-cyan-300">${d.name}</span> di bawah ini.</h3><p class="small mt-3">Petunjuk: ${part[1]}</p><div class="mt-3 text-sm">Skor: <b id="score" class="text-cyan-300">${quizScore}</b></div><button class="btn mt-3 w-full" onclick="nextQuiz()">Pertanyaan berikutnya →</button><p id="quizFeedback" class="small mt-3">Klik pin nomor 1–5 pada objek 3D untuk menjawab.</p></div>`;
 }
}

function renderPins(){
 const pos=devicePins[current]||[[0,0.8,.45],[-.75,.2,.35],[.75,.15,.35],[0,-.5,.4],[0,.05,-.5]];
 $('pins').innerHTML='';pinEls=[];
 pos.forEach((p,i)=>{
  let el=document.createElement('button');
  el.className='pin'+(i===activePin?' selected':'');
  el.textContent=i+1;
  el.onclick=()=>selectPin(i);
  $('pins').appendChild(el);
  pinEls.push({el,p:new THREE.Vector3(...p)});
 });
}

function selectPin(i){
 activePin=i;document.querySelectorAll('.pin').forEach((e,n)=>e.classList.toggle('selected',n===i));
 if(activeTab==='kuis'){
  const correct=(quizQuestion%5)===i;
  $('quizFeedback').textContent=correct?'Benar! Bagian berhasil diidentifikasi.':'Belum tepat. Coba perhatikan kembali model 3D.';
  $('quizFeedback').style.color=correct?'#4ade80':'#fb7185';
  if(correct){quizScore+=10;$('score').textContent=quizScore}
 }else renderTab();
}

function nextQuiz(){quizQuestion=(quizQuestion+1)%5;renderTab()}

function projectPins(){
 if(!model)return;const w=innerWidth,h=innerHeight;
 pinEls.forEach(({el,p})=>{
  let v=p.clone();model.localToWorld(v);v.project(camera);
  el.style.left=((v.x+1)*w/2)+'px';
  el.style.top=((-v.y+1)*h/2)+'px';
  el.style.display=showPins&&v.z<1?'block':'none';
 });
}

function animate(){
 requestAnimationFrame(animate);let t=clock.getElapsedTime();controls.update();
 if(model&&$('simulate').classList.contains('active'))model.rotation.y=Math.sin(t*1.1)*.12;
 if(signal){signal.position.x=Math.sin(t*1.7)*1.25;signal.position.z=Math.cos(t*1.7)*.6}
 projectPins();renderer.render(scene,camera);
}

function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
function togglePanel(which){$(which).classList.toggle('open')}
function setToggle(id,on){$(id).classList.toggle('active',on)}

document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderCatalog()});
$('search').addEventListener('input',renderCatalog);
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;renderTab()});
$('auto').onclick=()=>{autoRotate=!autoRotate;controls.autoRotate=autoRotate;setToggle('auto',autoRotate)};
$('pinsBtn').onclick=()=>{showPins=!showPins;setToggle('pinsBtn',showPins)};
$('xray').onclick=()=>{xray=!xray;applyVisualModes(model);setToggle('xray',xray)};
$('wire').onclick=()=>{wire=!wire;applyVisualModes(model);setToggle('wire',wire)};
$('axis').onchange=()=>{applyVisualModes(model)};
$('slice').oninput=()=>{if(clipPlane)clipPlane.constant=parseFloat($('slice').value)};
$('reset').onclick=()=>{camera.position.set(4,3.1,6.5);controls.target.set(0,0,0);controls.update();toast('Kamera dikembalikan ke posisi awal')};
$('simulate').onclick=()=>{
 if(signal){
  scene.remove(signal);signal.geometry.dispose();signal.material.dispose();signal=null;
  $('simulate').classList.remove('active');toast('Simulasi sinyal dihentikan');
 }else{
  signal=new THREE.Mesh(new THREE.SphereGeometry(.12,20,20),new THREE.MeshBasicMaterial({color:0x67e8f9}));
  scene.add(signal);$('simulate').classList.add('active');toast('Simulasi perjalanan sinyal optik aktif');
 }
};

init3D();renderCatalog();renderTab();lucide.createIcons();
</script>
</body></html>
